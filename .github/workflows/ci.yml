name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match local dev (node 24 / npm 11) — npm 10 rejects this lockfile
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint (errors fail; warnings reported)
        run: npx eslint src --ext .js,.jsx
      - name: Production build
        run: npm run build
        env:
          # Lint runs as the dedicated step above; inside the CRA build it
          # would re-run with CI=true promoting every warning to a failure.
          DISABLE_ESLINT_PLUGIN: "true"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Import check
        run: python -c "import sys; sys.path.insert(0, 'backend'); import app"
      - name: Unit tests
        run: python -m pytest backend/tests -q
